[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optisys"
version = "0.1.0.dev0"
description = "OptiSys-Lab: reproducible laser triangulation and 976 nm pump-optics simulation, tolerance analysis and audit platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OptiSys-Lab" }]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pandas>=2.2"]
ui = ["streamlit==1.66.0"]
# Optional L1 optical-engine dependency. G0 does not require it.
# P1 pump tracing and the G2 lens backend require the pinned Optiland release.
optics = ["optiland==0.6.3"]

[project.scripts]
optisys = "optisys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::RuntimeWarning"]
