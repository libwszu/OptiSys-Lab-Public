# OptiSys-Lab G1 configuration (schema 2.0, L0).
# Every optical/electrical number here is a DESIGN ASSUMPTION, not a datasheet
# value and not a measurement.  Units are declared once and applied explicitly.
schema_version: "2.0"
case_id: triangulation_g1_l0
model_level: L0

units:
  distance: mm
  angle: deg
  pixel_size: um

source:
  wavelength_nm: 650.0
  theta: 0.0            # interpreted with units.angle

geometry:
  baseline: 20.0        # interpreted with units.distance
  distance: [100.0, 300.0]
  working_range_enforced: true
  min_baseline_mm: 1.0
  singular_denominator_px: 1.0e-6
  sensor_margin_px: 0.0
  range_epsilon_mm: 1.0e-6

camera:
  focal_length: 8.0
  pixel_size: 3.45      # interpreted with units.pixel_size
  resolution_px: [1280, 1024]
  principal_point_px: [640.0, 512.0]

imaging:
  sigma_px: 2.5
  signal:
    mode: total_electrons      # peak_electrons from schema 1.0 is NOT reused
    total_electrons: 40000.0
  background_e_per_px: 100.0

sensor:
  read_noise_e: 3.0
  dark_rate_e_per_s: 1.0
  exposure_ms: 2.0
  full_well_e: 15000.0
  bit_depth: 12
  e_per_adu: 3.0
  black_level_adu: 100
  adc_max_adu: 4095

dataset:
  conditions:
    - name: strong
      total_electrons: 200000.0
      background_e_per_px: 50.0
      read_noise_e: 2.0
      reflectance_proxy: 0.90
    - name: medium
      total_electrons: 40000.0
      background_e_per_px: 100.0
      read_noise_e: 3.0
      reflectance_proxy: 0.35
    - name: weak
      total_electrons: 8000.0
      background_e_per_px: 200.0
      read_noise_e: 4.0
      reflectance_proxy: 0.08
  repeats: 40
  split:
    validation_distances: [120.0, 150.0, 180.0, 210.0, 240.0, 270.0, 295.0]
    test_distances: [110.0, 140.0, 170.0, 200.0, 230.0, 260.0, 290.0]
  representative_frames: 12

run:
  seed: 20261019
