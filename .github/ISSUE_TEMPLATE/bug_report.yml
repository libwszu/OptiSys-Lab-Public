name: Bug report
description: Report a reproducible CLI, UI, or simulation problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "请先脱敏日志；不要上传令牌、个人资料或非公开科研数据。安全漏洞请阅读 SECURITY.md。"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, relevant package versions, and commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands, configuration, and which case (650 nm or 976 nm)
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs (optional)
      render: text
